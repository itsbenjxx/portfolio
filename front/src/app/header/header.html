<header class="header">
  <div class="logo">
    <a routerLink="/" (click)="closeMenu()">PORTFOLIO</a>
  </div>

  <nav class="navbar" [class.is-open]="isMenuOpen()">
    <ul>
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      </li>
      <li>
        <a routerLink="/projets" routerLinkActive="active" (click)="closeMenu()">Projets</a>
      </li>
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
      </li>
    </ul>
  </nav>

  <div class="actions">
    <a href="/pdf/cv.pdf" target="_blank" class="btn-cv">CV</a>
    <button class="burger-btn" (click)="toggleMenu()" [class.is-active]="isMenuOpen()" aria-label="Menu mobile">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
<div class="gradient" [style.transform]="gradientTransform()"></div>
